<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<script src="{{ url_for('static', filename='js/products.js') }}"></script>
<body>
    <h1>{{category}}</h1>
    
    <div class="controls">
    <!-- Sort -->
        <label for="sort-price">Sort by price:</label>
        <select id="sort-price">
            <option value="">Default</option>
            <option value="asc">Price: Low to High</option>
            <option value="desc">Price: High to Low</option>
        </select>

        <!-- Filter -->
        <label>Price range:</label>
        <input type="number" id="min-price" placeholder="Min $" min="0" step="0.01">
        <input type="number" id="max-price" placeholder="Max $" min="0" step="0.01">
        <button id="filter-btn">Filter</button>
        <button id="reset-filter">Reset</button>
        
    </div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Photo</th>
                </tr>
            </thead>
            <tbody>
                {% for i in range(product_dict.title|length) %}
                <tr>
                    <td>
                        <a href="{{ product_dict.url[i] }}" target="_blank" class="product-name">
                            {{ product_dict.title[i] }}
                        </a>
                    </td>
                    <td>HK${{ product_dict.price[i] }}</td>
                    <td>
                        {% if product_dict.photo[i] %}
                            <img src="{{ product_dict.photo[i] }}" 
                                 alt="{{ product_dict.title[i] }}" 
                                 class="product-photo"
                                 onclick="openLightbox(this.src)">
                        {% else %}
                            —
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close">&times;</span>
        <img id="lightbox-img" src="" alt="Expanded product">
    </div>

    <script>
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // Close with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
